# Personal tmux layer, sourced after the Home Manager base config.
# The root table holds no Alt/Meta chords: those belong to shells and editors.
# Prefix, indexes, terminal, history, mouse, vi keys and escape/focus settings
# are Home Manager options in `modules/home/terminal.nix`; don't repeat them here.

# Drop defaults that collide with this layout: prefix C-o rotates every pane,
# prefix C-Left/C-Right resize by one cell (arrows do 20), t is the clock.
unbind -T prefix C-o
unbind -T prefix C-Left
unbind -T prefix C-Right
unbind -T prefix t

# Let Claude Code notification/progress escape sequences reach Ghostty, and
# preserve Shift+Enter as a distinct key through tmux.
set -g allow-passthrough all
set -s extended-keys on
# usstyle/sync/strikethrough/hyperlinks: Ghostty supports them, but tmux only
# enables features listed here (undercurl diagnostics, flicker-free redraws).
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys:usstyle:sync:strikethrough:hyperlinks,screen*:title,rxvt*:ignorefkeys'
# No secondary prefix: Ctrl-o stays with Neovim's jumplist and insert-mode Ctrl-o.
set -g prefix2 None
set -g renumber-windows on
# Killing a session's last window switches to another session instead of
# detaching, which would close the Ghostty surface.
set -g detach-on-destroy off
set -g status-position bottom
set -g set-titles on
set -g set-titles-string '#S:#W'
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}" \; select-layout -E
bind _ split-window -v -c "#{pane_current_path}" \; select-layout -E
# Cmd+W / Cmd+Shift+T: close a pane, reopen the last closed one (cwd, window,
# and `claude --resume` / `codex resume` for agent panes; up to 20 kept).
bind X run-shell 'tmux-pane-reopen close "#{pane_id}"'
bind T run-shell 'tmux-pane-reopen reopen "#{client_name}" "#{session_id}"'
bind c new-window -c "#{pane_current_path}"
# Fork the agent session in THIS pane into a new pane on the right.
# `f` auto-detects which agent the focused pane is running by reading the
# pane options @claude_sid / @codex_sid (set by each agent's SessionStart
# hook); if neither is set, falls back to Claude --continue. `o` forces
# Codex regardless. Both run the forked agent with permission/sandbox
# bypass so the new pane doesn't re-prompt for approvals.
# split-window + send-keys keeps the shell alive when the agent exits, so
# errors stay visible instead of the pane closing instantly. Both target the
# pane ids explicitly: run-shell has no current pane, and with several clients
# tmux would otherwise pick whichever was used last.
bind f run-shell 'cs=$(tmux show-option -pqv -t "#{pane_id}" @claude_sid); xs=$(tmux show-option -pqv -t "#{pane_id}" @codex_sid); if [ -n "$cs" ]; then cmd="claude --resume $cs --fork-session --permission-mode bypassPermissions"; elif [ -n "$xs" ]; then cmd="codex fork $xs --dangerously-bypass-approvals-and-sandbox"; else cmd="claude --continue --fork-session --permission-mode bypassPermissions"; fi; p=$(tmux split-window -P -F "##{pane_id}" -t "#{pane_id}" -h -c "#{pane_current_path}"); tmux send-keys -t "$p" "$cmd" Enter'
bind o run-shell 'sid=$(tmux show-option -pqv -t "#{pane_id}" @codex_sid); if [ -n "$sid" ]; then cmd="codex fork $sid --dangerously-bypass-approvals-and-sandbox"; else cmd="codex fork --last --dangerously-bypass-approvals-and-sandbox"; fi; p=$(tmux split-window -P -F "##{pane_id}" -t "#{pane_id}" -h -c "#{pane_current_path}"); tmux send-keys -t "$p" "$cmd" Enter'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Force pane swaps to use the active pane in the current window.
# This avoids tmux falling back to a marked pane from another window/session.
bind \{ swap-pane -s . -t '{previous}'
bind \} swap-pane -s . -t '{next}'
# swap-window -d keeps the active window's ID on the moved content, so you
# follow the window you just repositioned instead of staying at the old index.
bind H swap-window -d -t :-1
bind L swap-window -d -t :+1
# Reload the Home Manager shim, which sources the composed tmux config.
bind r source-file ~/.tmux.conf \; display-message "tmux config sourced"
bind R command-prompt -I "#S" { rename-session "%%" }
bind M command-prompt -p "move window to session:window" { move-window -t "%%" }
bind P command-prompt -p "move pane to session:window" { move-pane -t "%%" }
bind S command-prompt -p "new session name" { new-session -A -s "%%" }
# C-hjkl are direct tmux pane navigation. Use nvim's Ctrl-w h/j/k/l for
# editor splits; keeping this layer pure avoids mode-dependent pane jumps.
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
# Ctrl-Left/Right move between tmux windows. Ghostty also bridges these keys
# to prefix+p/n so the same shortcut works when its key handling intercepts
# the terminal sequence. Prefix+arrows remain the resize path.
bind -n C-Left previous-window
bind -n C-Right next-window
# Cmd+digit window selectors are generated in `modules/home/terminal.nix`.
# Pane resize: press prefix, then tap arrows repeatedly (repeat-key mode).
# Uses plain arrows — no Alt/Ctrl — so no collision with shell word-motion.
bind -r Left  resize-pane -L 20
bind -r Down  resize-pane -D 20
bind -r Up    resize-pane -U 20
bind -r Right resize-pane -R 20
# Zoom: Ctrl-Space toggles pane fullscreen. prefix + z still works as the
# tmux default.
bind -n C-Space resize-pane -Z
bind -T copy-mode-vi C-Space send-keys -X cancel
bind M-1 join-pane -t :1
bind M-2 join-pane -t :2
bind M-3 join-pane -t :3
bind M-4 join-pane -t :4
bind M-5 join-pane -t :5
bind M-6 join-pane -t :6
bind M-7 join-pane -t :7
bind M-8 join-pane -t :8
bind M-9 join-pane -t :9
# Layouts: prefix + 1..5 picks a preset layout; prefix + Space still cycles.
# Cmd+digit selects windows, so prefix+digit is free for layouts.
bind 1 select-layout even-horizontal
bind 2 select-layout even-vertical
bind 3 select-layout main-horizontal
bind 4 select-layout main-vertical
bind 5 select-layout tiled

# One copy path for y, Enter and mouse drags (OSC 52 still reaches Ghostty too).
set -s copy-command pbcopy
# Enter copy-mode pre-scrolled so the same finger keeps tapping C-u to keep going.
bind C-u copy-mode -u

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi J send-keys -X -N 5 cursor-down
bind -T copy-mode-vi K send-keys -X -N 5 cursor-up
bind -T copy-mode-vi t send-keys -X scroll-top
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode C-h select-pane -L
bind -T copy-mode C-j select-pane -D
bind -T copy-mode C-k select-pane -U
bind -T copy-mode C-l select-pane -R
setw -g automatic-rename off
setw -g allow-set-title on
set -g pane-border-status top
set -g pane-border-format ' #P#{?@workmux_pane_status, #{@workmux_pane_status},} #{?@agent_label,#{@agent_label},#{=48:pane_title}} '
bind W choose-tree -Z

# Theme follows the client (Ghostty reports system light/dark, live) and
# matches Ghostty's Atom One Light / One Dark Two. Styles are formats expanded
# per client at draw time, so no hook or reload is involved. To pin one theme,
# put `set -g @theme light` (or dark) in the host-local ~/.tmux.local.conf.
set -gu @theme
source-file -q ~/.tmux.local.conf
set -g @is-light '#{==:#{?@theme,#{@theme},#{client_theme}},light}'
set -g @bg      '#{?#{E:@is-light},#f9f9f9,#21252b}'
set -g @fg      '#{?#{E:@is-light},#2a2c33,#e6e6e6}'
set -g @muted   '#{?#{E:@is-light},#a0a1a7,#7f848e}'
set -g @surface '#{?#{E:@is-light},#e5e5e6,#393e47}'
set -g @accent  '#{?#{E:@is-light},#2f5af3,#71b9f4}'

set -g window-status-format         " #I:#W#{?@workmux_status, #{@workmux_status},} "
set -g window-status-current-format " #I:#W#{?@workmux_status, #{@workmux_status},} "
set -g status-left-length 100
set -g status-right-length 100
set -g status-style                "bg=#{E:@bg},fg=#{E:@fg}"
set -g window-status-style         "bg=#{E:@bg},fg=#{E:@muted}"
set -g window-status-current-style "bg=#{E:@surface},fg=#{E:@accent},bold"
set -g pane-border-style           "fg=#{E:@surface}"
set -g pane-active-border-style    "fg=#{E:@accent}"
set -g message-style               "bg=#{E:@surface},fg=#{E:@fg}"
set -g mode-style                  "bg=#{E:@surface},fg=#{E:@fg}"
set -g status-left  "#[bg=#{E:@accent},fg=#{E:@bg},bold] #S #[bg=#{E:@bg},fg=#{E:@accent}] "
set -g status-right "#[fg=#{E:@muted}] #{b:pane_current_path}  %H:%M "

# Plugins are declared in modules/home/terminal.nix and loaded by Home Manager.
# EasyJump is intentionally prefix+J only. Keep copy-mode Ctrl-j/Ctrl-J free
# for the pane-navigation policy above.
unbind -T copy-mode C-J
unbind -T copy-mode-vi C-J
