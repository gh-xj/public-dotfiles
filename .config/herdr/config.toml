# Public-safe Herdr defaults. Runtime sessions, sockets, logs, and pane history
# stay in ~/.config/herdr and are not tracked here.

[theme]
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+b"
detach = "prefix+q"
reload_config = "prefix+shift+r"
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
close_pane = "prefix+x"
zoom = "prefix+z"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+b"
type = "popup"
command = "btop"
width = "90%"
height = "80%"

[ui]
agent_panel_sort = "priority"
copy_on_select = true
hide_tab_bar_when_single_tab = false
mouse_capture = true
pane_borders = true
pane_gaps = true
pane_scrollbars = true
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "opencode", "copilot"]
