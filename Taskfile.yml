version: "3"

env:
  NIX_CONFIG: experimental-features = nix-command flakes

tasks:
  apply:
    desc: Apply the standalone public macOS baseline
    cmds:
      - ./scripts/bootstrap-macos.sh --darwin --apply {{.CLI_ARGS}}

  check:
    desc: Build once and run public behavioral checks
    aliases: [verify]
    cmds:
      - ./scripts/check.sh

  check:deep:
    desc: Run routine checks plus slow runtime and cross-profile probes
    cmds:
      - ./scripts/check.sh --deep

  doctor:
    desc: Diagnose generated output and runtime drift (-- --live includes running state)
    silent: true
    cmds:
      - python3 scripts/public-control.py doctor {{.CLI_ARGS}}

  raycast:install:
    desc: Verify and open install intents for missing Raycast extensions
    cmds:
      - ./scripts/verify-raycast-extensions.sh --open-missing

  display:layout:
    desc: Plan, apply or verify host-injected display layouts
    cmds:
      - bash scripts/apply-display-layout.sh {{.CLI_ARGS}}

  openers:list:
    desc: List common file openers and managed preferences
    cmds:
      - python3 scripts/default-openers.py list

  openers:plan:
    desc: Inspect default opener drift without changes
    cmds:
      - python3 scripts/default-openers.py plan

  openers:apply:
    desc: Apply and verify the public file-opening preferences
    cmds:
      - python3 scripts/default-openers.py apply

  openers:check:
    desc: Fail when managed file openers drift or an app is missing
    cmds:
      - python3 scripts/default-openers.py check
