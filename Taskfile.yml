version: "3"

env:
  NIX_CONFIG: experimental-features = nix-command flakes

tasks:
  apply:
    desc: Apply the standalone public macOS baseline
    cmds:
      - ./scripts/bootstrap-macos.sh --darwin --apply {{.CLI_ARGS}}

  check:
    desc: Build once and run public behavioral checks
    aliases: [verify]
    cmds:
      - ./scripts/check.sh

  doctor:
    desc: Diagnose source and generation drift (-- --live includes running state)
    silent: true
    cmds:
      - python3 scripts/public-control.py doctor {{.CLI_ARGS}}

  reconcile:
    desc: Explicitly plan or apply a selected Home Manager profile
    silent: true
    cmds:
      - python3 scripts/public-control.py reconcile {{.CLI_ARGS}}

  workspace:health:
    desc: Read-only bounded terminal, agent, workload and disk snapshot
    silent: true
    cmds:
      - python3 scripts/public-control.py workspace doctor {{.CLI_ARGS}}

  raycast:install:
    desc: Verify and open install intents for missing Raycast extensions
    cmds:
      - ./scripts/verify-raycast-extensions.sh --open-missing

  display:layout:
    desc: Plan, apply or verify host-injected display layouts
    cmds:
      - bash scripts/apply-display-layout.sh {{.CLI_ARGS}}
