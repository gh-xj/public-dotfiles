version: "3"

env:
  NIX_CONFIG: experimental-features = nix-command flakes

tasks:
  plan:
    desc: Build and preview standalone Home Manager changes
    cmds:
      - ./scripts/bootstrap-macos.sh --plan {{.CLI_ARGS}}

  apply:
    desc: Apply the standalone public Home Manager profile
    cmds:
      - ./scripts/bootstrap-macos.sh --apply {{.CLI_ARGS}}

  apps:
    desc: Install declared Homebrew apps and macOS-native tools without cleanup
    cmds:
      - brew bundle --file Brewfile --no-upgrade

  check:
    desc: Build once and run public behavioral checks
    aliases: [verify]
    cmds:
      - ./scripts/check.sh

  check:deep:
    desc: Run routine checks plus slow runtime and cross-profile probes
    cmds:
      - ./scripts/check.sh --deep

  doctor:
    desc: Diagnose generated output and runtime drift (-- --live includes running state)
    silent: true
    cmds:
      - python3 scripts/public-control.py doctor {{.CLI_ARGS}}

  raycast:install:
    desc: Verify and open install intents for missing Raycast extensions
    cmds:
      - ./scripts/verify-raycast-extensions.sh --open-missing

  display:layout:
    desc: Plan, apply or verify host-injected display layouts
    cmds:
      - bash scripts/apply-display-layout.sh {{.CLI_ARGS}}
